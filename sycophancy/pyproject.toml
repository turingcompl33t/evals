[project]
name = "sycophancy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kyle-dotterrer_usma", email = "kyle.dotterrer@westpoint.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openai>=3.48.0",
    "pydantic>=2.14.3",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[project.scripts]
sycophancy = "sycophancy:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
qa = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-seaborn>=0.13.2.20261107",
    "types-tqdm>=4.70.0.20261106",
]


[tool.black]
line-length = 80
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
mypy_path = "src"

[tool.isort]
profile = "black"
line_length = 80
src_paths = ["src"]

[tool.pytest]
python_files = ["*.py"]
